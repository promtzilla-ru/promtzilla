  <rect x="255" y="560" width="270" height="34" rx="17" fill="#b7c5c8"/>
  <circle cx="1010" cy="430" r="115" fill="#0f7c80" opacity=".22"/>
  <rect x="875" y="560" width="270" height="34" rx="17" fill="#0f7c80" opacity=".32"/>
  <text x="140" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="900" fill="#5f6d73">ДО</text>
  <text x="760" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="900" fill="#0f7c80">ПОСЛЕ</text>
  <text x="110" y="745" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#172126">ИИ аккуратно переносит лицо на другое фото с совпадением света, ракурса и тона кожи.</text>
