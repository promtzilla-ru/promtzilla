  <text x="110" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f7c80">ПРОМТЗИЛЛА · пример результата</text>
  <text x="110" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="900" fill="#172126">заменить лицо на фото через ИИ</text>
